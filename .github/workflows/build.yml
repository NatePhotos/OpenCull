# Builds OpenCull for macOS, Windows and Linux, and runs its tests on each.
#
# On every change to main it proves the app still builds everywhere, and
# keeps the installers with the run. On a version tag (v0.5.0) it also puts
# them on a draft release, to be looked over and published by hand.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A change to the words alone builds nothing.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ORT_CUDA_VERSION: "13"
      LINUXDEPLOY_EXCLUDED_LIBRARIES: "libcuda.so*;libcudart.so*;libcublas*.so*;libcurand.so*;libcudnn*.so*;libnvrtc*.so*;libnvidia*.so*"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          # Not an older Ubuntu: the ready-made ONNX Runtime the app links
          # against needs the C library of 24.04 or later, and so, then, does
          # the app.
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # What Tauri needs of the system, and what building libjpeg-turbo from
      # source needs: CMake everywhere, NASM on Intel and AMD.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file cmake nasm

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo pkgconf

      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Use the pinned npm version
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: CUDA launcher platform guards
        run: node --test scripts/cuda-desktop.test.mjs scripts/dev-desktop.test.mjs

      - name: macOS excludes CUDA even when the feature is requested
        if: runner.os == 'macOS'
        shell: bash
        env:
          OPENCULL_AI: cuda
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --features cuda -e features > /tmp/opencull-features.txt
          if grep -E 'opencull-cuda|ort feature "cuda"' /tmp/opencull-features.txt; then
            echo "CUDA leaked into the macOS dependency graph"
            exit 1
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features cuda

      - name: Compile the CUDA path on Linux
        if: runner.os == 'Linux'
        run: cargo check --manifest-path src-tauri/Cargo.toml --features cuda

      - name: Tests
        run: npm test

      - name: macOS desktop development startup
        if: runner.os == 'macOS'
        run: node .github/scripts/macos-dev-smoke.mjs

      # The app updates itself only from files signed with the project's
      # update key. Where that key is to hand, the build also makes those
      # files and the small `latest.json` that says where they are. Where it
      # is not — a pull request from a fork is never given it — the build
      # makes the installers alone, as it always did.
      - name: Signed updates, if the key is here
        id: updates
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "args=${KEY:+--config src-tauri/tauri.updater.conf.json}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ steps.updates.outputs.args }} ${{ runner.os == 'Linux' && '--features cuda --config src-tauri/tauri.cuda.conf.json' || '' }}
          # Of the two Windows installers, the one an update falls back on.
          updaterJsonPreferNsis: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: OpenCull ${{ github.ref_name }}
          releaseBody: See the README for what works, what does not yet, and how to open the app the first time.
          releaseDraft: true
          prerelease: false

      - name: Verify Linux CUDA provider packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PYCODE'
          import pathlib, subprocess, tarfile, io
          root = pathlib.Path('src-tauri/target/release/bundle')
          required = {'libonnxruntime_providers_cuda.so', 'libonnxruntime_providers_shared.so'}
          packages = list((root / 'deb').glob('*.deb'))
          assert packages, 'No Debian installer was produced'
          for package in packages:
              data = subprocess.check_output(['ar', 'p', str(package), 'data.tar.gz'])
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  found = {pathlib.PurePosixPath(member.name).name for member in archive.getmembers()
                           if pathlib.PurePosixPath(member.name).parent.as_posix().lstrip('./') == 'usr/bin' and member.size > 0}
                  assert required <= found, f'Missing provider in {package}'
          images = list((root / 'appimage').glob('*.AppImage'))
          assert images, 'No AppImage was produced'
          import tempfile
          for image in images:
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run([str(image.resolve()), '--appimage-extract'], cwd=directory,
                                 check=True, stdout=subprocess.DEVNULL)
                  for name in required:
                      assert (pathlib.Path(directory) / 'squashfs-root/usr/bin' / name).stat().st_size > 0
          print('CUDA and shared provider files verified in Debian and AppImage installers')
          PYCODE

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: OpenCull-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
