# Builds OpenCull for macOS, Windows and Linux, and runs its tests on each.
#
# On every change to main it proves the app still builds everywhere, and
# keeps the installers with the run. On a version tag (v0.2.0) it also puts
# them on a draft release, to be looked over and published by hand.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A change to the words alone builds nothing.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          # Not an older Ubuntu: the ready-made ONNX Runtime the app links
          # against needs the C library of 24.04 or later, and so, then, does
          # the app.
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # What Tauri needs of the system, and what building libjpeg-turbo from
      # source needs: CMake everywhere, NASM on Intel and AMD.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file cmake nasm

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo

      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci

      # The interface's tests, then the Rust half's.
      - name: Tests
        run: npm test

      # Lints every target, the examples included: they are not built by
      # the tests, and would otherwise drift from the code they exercise.
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: OpenCull ${{ github.ref_name }}
          releaseBody: See the README for what works, what does not yet, and how to open the app the first time.
          releaseDraft: true
          prerelease: true

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: OpenCull-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
