# Builds OpenCull for macOS, Windows and Linux, and runs its tests on each.
#
# On every change to main it proves the app still builds everywhere, and
# keeps the installers with the run. On a version tag (v0.2.0) it also puts
# them on a draft release, to be looked over and published by hand.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A change to the words alone builds nothing.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ORT_CUDA_VERSION: "13"
      LINUXDEPLOY_EXCLUDED_LIBRARIES: "libcuda.so*;libcudart.so*;libcublas*.so*;libcurand.so*;libcudnn*.so*;libnvrtc*.so*;libnvidia*.so*"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          # The oldest Ubuntu GitHub still offers, so that the app, and the
          # libraries the AppImage carries from this machine, run on Ubuntu
          # 22.04 and later. Its ONNX Runtime is Microsoft's own build, made to
          # run on older Linux (see "ONNX Runtime for Linux" below).
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # What was built on another Ubuntu must not be reused on this one.
          key: ${{ runner.os == 'Linux' && matrix.os || '' }}

      # What Tauri needs of the system, and what building libjpeg-turbo from
      # source needs: CMake everywhere, NASM on Intel and AMD.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file cmake nasm

      # The ONNX Runtime `ort` downloads by itself is built on a newer Linux,
      # and would tie the app to glibc 2.38 (Ubuntu 24.04). Microsoft's own
      # release of the very same version (1.28.0, the one this `ort` is made
      # for) runs on far older Linux, and carries the same CUDA provider files.
      # Tests and checks link to it; the app itself loads it at start from
      # beside its own program file (`ort/load-dynamic`, in the Build step).
      - name: ONNX Runtime for Linux
        if: runner.os == 'Linux'
        env:
          ORT_VERSION: "1.28.0"
          ORT_SHA256: 84d28f27589090b280d4312743efd3d450cd4ac7d1e1d75e7d9076d9637bf9de
        run: |
          name="onnxruntime-linux-x64-gpu_cuda13-$ORT_VERSION"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$name.tgz"
          echo "$ORT_SHA256  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/$name.tgz"
          lib="$RUNNER_TEMP/$name/lib"
          ls -l "$lib"
          echo "ORT_LIB_LOCATION=$lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          # What the CUDA provider asks of the system, for the record.
          readelf -d "$lib/libonnxruntime_providers_cuda.so" | grep NEEDED

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo pkgconf

      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Use the pinned npm version
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Ensure macOS excludes CUDA
        if: runner.os == 'macOS'
        shell: bash
        env:
          OPENCULL_AI: cuda
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --features cuda -e features > /tmp/opencull-features.txt
          if grep -E 'opencull-cuda|ort feature "cuda"' /tmp/opencull-features.txt; then
            echo "CUDA leaked into the macOS dependency graph"
            exit 1
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features cuda

      - name: Compile CUDA path on Linux
        if: runner.os == 'Linux'
        run: cargo check --manifest-path src-tauri/Cargo.toml --features cuda

      - name: Tests
        run: npm test
        env:
          # On Linux the test programs link to Microsoft's ONNX Runtime above.
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && env.ORT_LIB_LOCATION || '' }}

      - name: macOS desktop startup
        if: runner.os == 'macOS'
        run: node .github/scripts/macos-dev-smoke.mjs

      # The app updates itself only from files signed with the project's
      # update key. Where that key is to hand, the build also makes those
      # files and the small `latest.json` that says where they are. Where it
      # is not — a pull request from a fork is never given it — the build
      # makes the installers alone, as it always did.
      - name: Signed updates, if the key is here
        id: updates
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "args=${KEY:+--config src-tauri/tauri.updater.conf.json}" >> "$GITHUB_OUTPUT"

      # The app loads ONNX Runtime from beside its own program file, and ONNX
      # Runtime finds its CUDA provider files beside itself: all three go in
      # where the installers take them from.
      - name: Put ONNX Runtime where the Linux installers take it from
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/target/release
          for file in libonnxruntime_providers_cuda.so libonnxruntime_providers_shared.so; do
            cp --remove-destination "$ORT_LIB_LOCATION/$file" src-tauri/target/release/
          done
          cp --remove-destination "$(readlink -f "$ORT_LIB_LOCATION/libonnxruntime.so")" src-tauri/target/release/libonnxruntime.so

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ steps.updates.outputs.args }} ${{ runner.os == 'Linux' && '--features cuda,ort/load-dynamic --config src-tauri/tauri.cuda.conf.json --config src-tauri/tauri.linux-ort.conf.json' || '' }}
          # Of the two Windows installers, the one an update falls back on.
          updaterJsonPreferNsis: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: OpenCull ${{ github.ref_name }}
          releaseBody: See the README for what works, what does not yet, and how to open the app the first time.
          releaseDraft: true
          prerelease: true

      - name: Verify Linux CUDA provider packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PYCODE'
          import io, pathlib, subprocess, tarfile, tempfile
          root = pathlib.Path('src-tauri/target/release/bundle')
          required = {'libonnxruntime.so', 'libonnxruntime_providers_cuda.so', 'libonnxruntime_providers_shared.so'}
          packages = list((root / 'deb').glob('*.deb'))
          assert packages, 'No Debian installer was produced'
          for package in packages:
              data = subprocess.check_output(['ar', 'p', str(package), 'data.tar.gz'])
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  found = {pathlib.PurePosixPath(member.name).name for member in archive.getmembers()
                           if pathlib.PurePosixPath(member.name).parent.as_posix().lstrip('./') == 'usr/bin' and member.size > 0}
                  assert required <= found, f'Missing provider in {package}'
          images = list((root / 'appimage').glob('*.AppImage'))
          assert images, 'No AppImage was produced'
          for image in images:
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run([str(image.resolve()), '--appimage-extract'], cwd=directory,
                                 check=True, stdout=subprocess.DEVNULL)
                  for name in required:
                      assert (pathlib.Path(directory) / 'squashfs-root/usr/bin' / name).stat().st_size > 0
          print('ONNX Runtime, CUDA and shared provider files verified in Debian and AppImage installers')
          PYCODE

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: OpenCull-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # The AppImage on the oldest Linux it is meant for, as the AppImage catalog
  # tests it: on Ubuntu 22.04, with no network.
  linux-older:
    name: Linux AppImage on Ubuntu 22.04
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCull-Linux
          path: installers

      - name: Unpack the AppImage
        run: |
          image=$(find installers -name '*.AppImage' | head -n 1)
          test -n "$image"
          chmod +x "$image"
          "$image" --appimage-extract > /dev/null
          ls -l squashfs-root/usr/bin

      # Every program and library inside counts, even ones loaded only now and
      # then, like the CUDA provider: the catalog counts them all.
      - name: Newest C and C++ library versions it needs
        run: |
          versions() { # $1: GLIBC or GLIBCXX
            find squashfs-root -type f -print0 | while IFS= read -r -d '' f; do
              [ "$(od -An -tx1 -N4 "$f")" = " 7f 45 4c 46" ] || continue
              objdump -T "$f" 2>/dev/null | grep '\*UND\*' | grep -oE "$1_[0-9]+(\.[0-9]+)+" | sed "s/^$1_/$f /"
            done | sort -k2 -V
          }
          for kind in GLIBC GLIBCXX; do
            versions $kind > "$kind.txt"
            echo "Newest $kind needed: $(tail -n 1 "$kind.txt")"
          done
          glibc=$(tail -n 1 GLIBC.txt | cut -d' ' -f2)
          glibcxx=$(tail -n 1 GLIBCXX.txt | cut -d' ' -f2)
          ok=1
          [ "$(printf '%s\n' "$glibc" 2.35 | sort -V | tail -n 1)" = 2.35 ] || { echo "::error::Needs GLIBC_$glibc; Ubuntu 22.04 has 2.35"; ok=0; }
          [ "$(printf '%s\n' "$glibcxx" 3.4.30 | sort -V | tail -n 1)" = 3.4.30 ] || { echo "::error::Needs GLIBCXX_$glibcxx; Ubuntu 22.04 has 3.4.30"; ok=0; }
          if [ $ok = 0 ]; then
            echo "Files needing more than 22.04 has:"
            awk '$2 > "2.35"' GLIBC.txt | sort -u | head -n 40 || true
            awk '$2 > "3.4.30"' GLIBCXX.txt | sort -u | head -n 40 || true
            exit 1
          fi

      - name: CUDA provider files are inside
        run: |
          for file in libonnxruntime.so libonnxruntime_providers_cuda.so libonnxruntime_providers_shared.so; do
            test -s "squashfs-root/usr/bin/$file"
            ls -l "squashfs-root/usr/bin/$file"
          done

      # The ONNX Runtime the app loads, loaded here the same way, on 22.04.
      - name: ONNX Runtime loads on 22.04
        run: |
          python3 - <<'PYCODE'
          import ctypes
          lib = ctypes.CDLL('squashfs-root/usr/bin/libonnxruntime.so')
          class Base(ctypes.Structure):
              _fields_ = [('GetApi', ctypes.CFUNCTYPE(ctypes.c_void_p, ctypes.c_uint32)),
                          ('GetVersionString', ctypes.CFUNCTYPE(ctypes.c_char_p))]
          lib.OrtGetApiBase.restype = ctypes.POINTER(Base)
          base = lib.OrtGetApiBase().contents
          version = base.GetVersionString().decode()
          print('ONNX Runtime', version)
          assert version == '1.28.0', version
          assert base.GetApi(27), 'API 27 unavailable'
          ctypes.CDLL('squashfs-root/usr/bin/libonnxruntime_providers_shared.so')
          print('ONNX Runtime and its shared provider file load on this system')
          PYCODE

      - name: Desktop packages for the test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick

      # Started as the catalog does: a virtual screen, no network at all. It
      # must still be running after a while, with its window showing.
      - name: Starts with no network
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          offline() { sudo unshare -n sudo -u "$(id -un)" env DISPLAY=:99 HOME="$HOME" XDG_RUNTIME_DIR="$RUNNER_TEMP" "$@"; }
          if offline curl -sS -m 5 https://github.com > /dev/null 2>&1; then echo "::error::the network is not blocked"; exit 1; fi
          offline ./squashfs-root/AppRun > app.log 2>&1 &
          pid=$!
          shown=no
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 $pid 2>/dev/null || break
            if xdotool search --onlyvisible --name OpenCull > /dev/null 2>&1; then shown=yes; fi
          done
          alive=no; kill -0 $pid 2>/dev/null && alive=yes
          echo "--- app output ---"; cat app.log
          echo "Still running after 30 s: $alive; window showing: $shown"
          pkill -f squashfs-root/usr/bin/opencull || true
          [ $alive = yes ] || { echo "::error::OpenCull exited or crashed"; exit 1; }
          [ $shown = yes ] || { echo "::error::OpenCull's window never showed"; exit 1; }
          if grep -qiE 'panicked|segmentation|core dumped' app.log; then echo "::error::trouble in the output"; exit 1; fi

      # The whole app at work on a folder, still with no network: it opens it,
      # makes previews, and reports.
      - name: Self-test with no network
        run: |
          Xvfb :98 -screen 0 1280x800x24 > /dev/null 2>&1 &
          sleep 2
          mkdir -p photos
          for i in 1 2 3; do convert -size 3000x2000 plasma:fractal "photos/IMG_000$i.jpg"; done
          sudo unshare -n sudo -u "$(id -un)" env DISPLAY=:98 HOME="$HOME" XDG_RUNTIME_DIR="$RUNNER_TEMP" \
            timeout 150 ./squashfs-root/AppRun --selftest "$PWD/photos" 2>&1 | tee selftest.log
          status=${PIPESTATUS[0]}
          echo "Self-test exit status: $status"
          [ "$status" = 0 ]
